<title>YTFL Draft Room 2026</title>
<style>
:root{
  --bg:#0A0E1A; --s1:#111827; --s2:#1A2332; --s3:#0D1424; --line:#243044;
  --ink:#F2F5FA; --ink2:#9BA8BC; --ink3:#64748B;
  /* verdict colors - RESERVED for verdicts, clock states, seat hot/cold only */
  --go:#34D399; --stop:#F87171; --warn:#FBBF24; --info:#60A5FA;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme=dark]){--bg:#F7F9FC;--s1:#FFFFFF;--s2:#EEF2F7;--s3:#F2F5F9;--line:#D8E0EA;
  --ink:#111827;--ink2:#4B5563;--ink3:#6B7280;--go:#059669;--stop:#DC2626;--warn:#B45309;--info:#2563EB}
}
:root[data-theme=light]{--bg:#F7F9FC;--s1:#FFFFFF;--s2:#EEF2F7;--s3:#F2F5F9;--line:#D8E0EA;
  --ink:#111827;--ink2:#4B5563;--ink3:#6B7280;--go:#059669;--stop:#DC2626;--warn:#B45309;--info:#2563EB}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.num{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.wrap{max-width:1100px;margin:0 auto;padding:12px 16px 24px;
  padding-left:max(16px, env(safe-area-inset-left));padding-right:max(16px, env(safe-area-inset-right))}
header{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
  border-bottom:1px solid var(--line);padding:8px 0 12px;margin-bottom:12px}
h1{font-size:20px;font-weight:800;letter-spacing:-.03em;margin:0}
h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--ink2);margin:0 0 8px}
.mode{font-size:12px;font-weight:600;padding:4px 12px;border-radius:99px;
  border:1px solid var(--line);background:var(--s2);color:var(--ink2)}
.mode.live{border-color:var(--go);color:var(--go)}
.banner{background:var(--s2);border:1px solid var(--line);border-radius:8px;
  padding:8px 12px;font-size:13px;color:var(--ink2);margin-bottom:12px}
.banner.err{border-color:var(--stop);color:var(--stop)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:12px;
  padding:16px;margin-bottom:12px}
.small{font-size:12px;color:var(--ink3)}
.muted{color:var(--ink2)}
.inj{color:var(--stop);font-size:11px;font-weight:700;text-transform:uppercase}
.floor{color:var(--ink3);font-size:10px;font-weight:600;border:1px solid var(--line);
  border-radius:4px;padding:1px 5px;margin-left:6px;text-transform:uppercase;letter-spacing:.04em}
.thin{color:var(--ink3);font-size:10px}
/* verdict-first round cards */
.rowcard{border-top:1px solid var(--line);padding:12px 0}
.rowcard:first-of-type{border-top:0;padding-top:4px}
.rc-top{display:flex;justify-content:space-between;gap:12px}
.rc-name{font-size:17px;font-weight:700;letter-spacing:-.01em}
.rc-meta{font-size:12px;color:var(--ink2);margin-top:2px}
.rc-pick{font-size:11px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
.verdict{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.verdict.wait{color:var(--go)}
.verdict.take{color:var(--stop)}
.verdict.coin{color:var(--warn)}
.sbar{height:4px;border-radius:2px;background:var(--s3);margin:8px 0 2px;overflow:hidden}
.sbar i{display:block;height:100%;border-radius:2px;background:var(--info)}
.rc-body{font-size:13px;color:var(--ink2);margin-top:6px}
.rc-body b{color:var(--ink)}
details{margin-top:6px}
summary{cursor:pointer;font-size:12px;color:var(--ink3);list-style:none;-webkit-user-select:none;user-select:none}
summary::before{content:"+ "}
details[open] summary::before{content:"- "}
.gap{margin-top:8px;font-size:12px;color:var(--ink2)}
.gap b{color:var(--ink)}
.seat{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:1px 6px;
  margin:3px 3px 0 0;background:var(--s2);white-space:nowrap;font-size:11px}
.seat.hot{border-color:var(--stop);color:var(--stop)}
.seat.cold{border-color:var(--go);color:var(--go)}
/* priors table (the one real table left) */
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--ink3);font-weight:600;font-size:11px;text-transform:uppercase;
  letter-spacing:.06em;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
/* sticky bottom seat bar - the thumb zone */
.seatbar{position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding:8px max(12px, env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left))}
.seatbar .lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;
  color:var(--ink3);margin:0 0 4px 2px}
.chips{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;min-width:44px;height:44px;border-radius:10px;
  background:var(--s2);border:1px solid var(--line);color:var(--ink2);
  font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer}
.chips button.on{background:var(--info);border-color:var(--info);color:#fff}
/* live mode */
.bignm{font-size:clamp(40px,11vw,64px);font-weight:800;letter-spacing:-.03em;line-height:1.02;margin:8px 0 2px;min-height:1.1em}
.bigpos{font-size:18px;color:var(--ink2)}
.clockrow{display:flex;gap:20px;flex-wrap:wrap;margin:4px 0}
.clock{font-size:44px;font-weight:700;font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.clock.low{color:var(--stop)}
.onclock{font-size:14px;color:var(--ink2)}
.runner{font-size:15px;margin:3px 0}
.prov{font-size:11px;color:var(--ink3);border-top:1px solid var(--line);
  margin-top:16px;padding-top:10px;line-height:1.6}
@media (min-width:640px){h1{font-size:22px}.wrap{padding-top:20px}}
@media (min-width:1024px){.rc-name{font-size:18px}}
</style>
</head>

  s.sheet.insertRule("header{" + A + "-items:baseline}", 2);
  s.sheet.insertRule(".clockrow{" + A + "-items:center}", 3);
  s.sheet.insertRule(".rc-top{" + A + "-items:flex-start}", 4);
  s.sheet.insertRule(".rc-top .verdict{text-" + A + ":right}", 5);
  s.sheet.insertRule(".chips button{text-" + A + ":center}", 6);
})();
const E = JSON.parse(document.getElementById("engine-data").textContent || "{}");
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---- survival math, identical bands to the engine (fitted to 2,039 league picks)
// Smooth power law fitted to 2,039 league picks. Replaced a 4-band step whose
// edges made one ADP slot worth an 8,284x survival difference at pick 48.
function sdFor(adp){
  // Piecewise-linear over the 12 empirical (adp, sd) bins EMBEDDED by the
  // engine - the JS interpolates the same numbers Python used, never re-derives.
  const c = E.adp_sd_curve;
  if (adp <= c[0][0]) return c[0][1];
  if (adp >= c[c.length - 1][0]) return c[c.length - 1][1];
  for (let i = 0; i + 1 < c.length; i++){
    const [a0, s0] = c[i], [a1, s1] = c[i + 1];
    if (adp >= a0 && adp <= a1) return s0 + (adp - a0) / (a1 - a0) * (s1 - s0);
  }
  return c[c.length - 1][1];
}
function erfc(x){ // Abramowitz-Stegun 7.1.26 in PRODUCT form. Computing erf first
  // and subtracting collapses to a hard 0 past z~6 (1 - erf rounds to 0 when erf
  // saturates at 1.0), which is the two-surfaces tail bug the parity test guards.
  const ax = Math.abs(x);
  const t = 1 / (1 + 0.3275911 * ax);
  const y = (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t
    - 0.284496736) * t + 0.254829592) * t * Math.exp(-ax * ax);
  return x < 0 ? 2 - y : y;
}
function rawSurvival(adp, pick){
  if (adp >= 900) return 1;
  const z = (pick - adp) / (sdFor(adp) * Math.SQRT2);
  return Math.min(1, Math.max(0, 0.5 * erfc(z)));
}
// Normalized so survival(adp,1) === 1. The bare normal puts mass below pick 1,
// which made the consensus number-one player read 50% available before anyone
// had picked. Mirrors survival() in src/engine_2026.py.
function survival(adp, pick){
  if (adp >= 900) return 1;
  const base = rawSurvival(adp, 1);
  return base <= 1e-12 ? 0 : Math.min(1, Math.max(0, rawSurvival(adp, pick) / base));
}
// P(survive to pick k | still alive at current overall pick c) - truncation
function condSurvival(adp, k, c){
  const sc = survival(adp, c);
  return sc <= 0 ? 0 : Math.min(1, survival(adp, k) / sc);
}
// Exposed for the parity test: tests/smoke_draft_room.js asserts these reproduce
// E.survival_reference, the Python-computed anchors embedded by the engine.
window.__survival = survival;
window.__sdFor = sdFor;
const pct = (p) => Math.round(p * 100) + "%";
const norm = (s) => String(s).toLowerCase().replace(/[.']/g, "")
  .replace(/\s+(jr|sr|ii|iii|iv|v)$/,"").trim();

// Who picks between this turn and the next, and how each leans at the target
// position. CONTEXT ONLY - never folded into the probability. Folding it in was
// tested and made the model worse out of sample (see E.tendency_note).
function gapStrip(r, pos){
  if (!r.gap_seats || !r.gap_seats.length) return "";
  const chips = r.gap_seats.map(s => {
    const l = s.lift;
    const cls = l === null ? "" : (l >= 1.10 ? " hot" : (l <= 0.90 ? " cold" : ""));
    const val = l === null ? "?" : l.toFixed(2) + "x";
    return `<span class="seat${cls}" title="pick ${s.pick}">${esc(s.franchise)} ${val}${s.thin ? "*" : ""}</span>`;
  }).join("");
  const lean = r.gap_lift === null || r.gap_lift === undefined ? "unknown"
    : r.gap_lift.toFixed(2) + "x league average";
  return `<div class="gap"><b>${r.gap_seats.length} seats pick before your next turn</b>
    - collectively ${lean} at ${pos} (context only, not in the probability)<br>${chips}</div>`;
}

function injBadge(p){ return p.injury ? ` <span class="inj">${esc(p.injury)}</span>` : ""; }

// ---- Mode 1: verdict-first round cards for the twelve pre-draft scenarios
function verdictChip(r){
  const w = r.wait_or_reach;
  if (r.coin_flips && r.coin_flips.length && w.verdict === "TAKE NOW" && w.comparable)
    return `<span class="verdict take">TAKE NOW</span>`;
  if (w.verdict === "WAIT") return `<span class="verdict wait">WAIT</span>`;
  return `<span class="verdict take">TAKE NOW</span>`;
}
function renderPre(activeSlot){
  const rounds = E.slots[activeSlot];
  let h = `<div class="card"><h2>Slot ${activeSlot} - your picks ${
    rounds.slice(0, 6).map(r => r.pick).join(", ")} ...</h2>`;
  for (const r of rounds){
    if (r.kdef){
      h += `<div class="rowcard"><div class="rc-top"><div>
        <div class="rc-pick">Rd ${r.round} - pick ${r.pick}</div>
        <div class="rc-name">K or DEF, best available<span class="floor">projection = floor</span></div>
        <div class="rc-meta">${esc(E.kdef_note)}</div></div></div></div>`;
      continue;
    }
    if (!r.primary){
      h += `<div class="rowcard"><div class="rc-pick">Rd ${r.round} - pick ${r.pick}</div>
        <div class="rc-name muted">board empty in model - go live</div></div>`;
      continue;
    }
    const p = r.primary, w = r.wait_or_reach;
    const surv = p.p_available_now;
    let body;
    if (w.comparable){
      const c = w.comparable;
      body = `Take <b>${esc(p.name)}</b> now - ${pct(p.p_gone_by_next)} he is gone by pick ${r.next_pick}.
        Or wait: <b>${esc(c.name)}</b> projects within ${Math.abs(c.pts_gap).toFixed(0)} pts and is
        ${pct(c.p_survives_next)} to last to your next pick.`;
    } else {
      body = `No comparable ${p.pos} is likely to survive to pick ${r.next_pick} -
        ${pct(p.p_gone_by_next)} that ${esc(p.name)} himself is gone.`;
    }
    const watch = [];
    if (r.tier_cliff) watch.push(`<span class="verdict take" style="font-size:11px">${p.pos} tier empties before your next turn</span>`);
    for (const u of r.urgent) watch.push(`${esc(u.franchise)} takes ${p.pos} by rd ${u.round.toFixed(1)} <span class="thin">(n ${u.n_eff.toFixed(1)})</span>`);
    if (r.coin_flips.length) watch.push(`<span class="verdict coin" style="font-size:11px">COIN FLIP</span> with ${r.coin_flips.map(esc).join(", ")} - break toward ceiling`);
    h += `<div class="rowcard">
      <div class="rc-top">
        <div>
          <div class="rc-pick">Rd ${r.round} - pick ${r.pick}</div>
          <div class="rc-name">${esc(p.name)}${injBadge(p)}</div>
          <div class="rc-meta">${p.pos} - VOR <span class="num">${p.vor.toFixed(0)}</span> - tier ${p.tier ?? "-"} - ADP <span class="num">${p.adp.toFixed(1)}</span> - <span class="num">${pct(surv)}</span> available${r.fallback ? " - fallback " + esc(r.fallback.name) + " " + r.fallback.pos : ""}</div>
        </div>
        ${verdictChip(r)}
      </div>
      <div class="sbar"><i style="width:${Math.round(surv * 100)}%"></i></div>
      <div class="rc-body">${body}</div>
      ${watch.length ? `<div class="rc-body">${watch.join("<br>")}</div>` : ""}
      <details><summary>who picks between my turns</summary>${gapStrip(r, p.pos) || '<div class="gap">no data</div>'}</details>
    </div>`;
  }
  h += `</div>`;

  // opponent priors - context card below the scenario
  h += `<div class="card"><h2>The table, as mapped today</h2>
  <table><tr><th>Seat</th><th>Handle</th><th>Franchise era</th><th>1st QB</th><th>1st TE</th><th>n_eff</th></tr>`;
  for (const r of E.rosters){
    h += `<tr><td class="num">${r.roster_id}</td><td>${esc(r.handle)}</td><td>${esc(r.franchise)}</td>
      <td class="num">${r.first_qb ?? "-"}</td><td class="num">${r.first_te ?? "-"}</td>
      <td class="num">${r.n_eff ?? "-"}${r.thin ? ' <span class="thin">thin</span>' : ""}</td></tr>`;
  }
  h += `</table><p class="small">Opponent priors: recency-weighted, shrunk toward league means.
    Thin eras are labelled - never quote one without its n_eff.</p></div>`;

  $("app").innerHTML = h;
  $("seatbar").hidden = false;
  const chips = $("chips");
  chips.innerHTML = Object.keys(E.slots).map(Number).sort((a, b) => a - b).map(s =>
    `<button data-slot="${s}" class="${s === activeSlot ? "on" : ""}" title="Slot ${s}">${s}</button>`).join("");
  chips.querySelectorAll("button").forEach(b =>
    b.addEventListener("click", () => renderPre(Number(b.dataset.slot))));
}

// ---- Mode 2: live draft
const LiveState = { picks: [], mySlot: null, timer: null, lastPickCount: -1, clockStart: null };

function myPicks(slot){
  const out = [];
  for (let r = 1; r <= E.league.rounds; r++)
    out.push((r - 1) * E.league.teams + (r % 2 === 1 ? slot : E.league.teams + 1 - slot));
  return out;
}
function renderLive(draft){
  const gone = new Set(LiveState.picks.map(p => {
    const md = p.metadata || {};
    return norm((md.first_name || "") + " " + (md.last_name || "")) + "|" + (md.position || "");
  }));
  const alive = E.players.filter(p => !gone.has(norm(p.name) + "|" + p.pos));
  const cur = LiveState.picks.length + 1;
  const rd = Math.ceil(cur / E.league.teams);
  const inRd = cur - (rd - 1) * E.league.teams;
  const slotOnClock = rd % 2 === 1 ? inRd : E.league.teams + 1 - inRd;
  const rosterOnClock = (draft.slot_to_roster_id || {})[slotOnClock];
  const seat = E.rosters.find(r => r.roster_id === rosterOnClock);
  const my = LiveState.mySlot;
  const mine = my ? myPicks(my) : [];
  const myNextTwo = mine.filter(k => k >= cur).slice(0, 2);
  const isMe = my !== null && slotOnClock === my;
  const lastTwoRounds = rd >= E.league.rounds - 1;

  let pool = alive.filter(p => lastTwoRounds ? (p.pos === "K" || p.pos === "DEF")
                                             : (p.pos !== "K" && p.pos !== "DEF"));
  pool.sort((a, b) => b.vor - a.vor);
  const top = pool[0];
  const runners = pool.slice(1, 3);

  let h = `<div class="card">
    <div class="clockrow">
      <div><div class="onclock">Pick <b class="num">${cur}</b> - round ${rd} -
        on the clock: <b>${seat ? esc(seat.franchise) + " (" + esc(seat.handle) + ")" : "seat " + slotOnClock}</b>
        ${isMe ? '<span class="verdict take"> - YOU</span>' : ""}</div>
        <div id="clock" class="clock">2:00</div>
        <div class="small">rule 3.2 - two minutes, forfeit on expiry. Clock resets when a pick is detected (10s poll).</div>
      </div>
    </div>`;
  if (top){
    h += `<div class="bignm">${esc(top.name)}</div>
      <div class="bigpos">${top.pos} ${esc(top.team)} - VOR <span class="num">${top.vor.toFixed(0)}</span> - tier ${top.tier ?? "-"}
      ${top.floor ? '<span class="floor">projection = floor</span>' : ""}${injBadge(top)}</div>`;
    for (const r of runners){
      const why = top.vor - r.vor <= 8 && r.pos === top.pos
        ? '<span class="verdict coin" style="font-size:12px">COIN FLIP - break toward ceiling</span>'
        : `<span class="num">${(top.vor - r.vor).toFixed(0)}</span> VOR behind`;
      h += `<div class="runner">${esc(r.name)} ${r.pos} VOR <span class="num">${r.vor.toFixed(0)}</span> - ${why}${injBadge(r)}</div>`;
    }
    if (myNextTwo.length >= 2 && !lastTwoRounds){
      const nxt = myNextTwo[isMe ? 1 : 0] || myNextTwo[0];
      const comp = pool.find(p => p !== top && p.pos === top.pos && top.vor - p.vor <= 8);
      if (comp){
        const s = condSurvival(comp.adp, nxt, cur);
        h += `<div class="rc-body">Wait or reach: <b>${esc(comp.name)}</b> projects within
          <span class="num">${Math.abs(top.pts - comp.pts).toFixed(0)}</span> pts and is <span class="num">${pct(s)}</span> to last to your pick ${nxt}
          - ${s >= 0.6 ? '<span class="verdict wait">you can WAIT</span>' : '<span class="verdict take">take now</span>'}</div>`;
      }
    }
  } else {
    h += `<div class="bignm muted">board clear</div>`;
  }
  h += `</div>`;

  if (my && myNextTwo.length){
    h += `<div class="card"><h2>Survival to your pick ${myNextTwo[0]}</h2>
      <table><tr><th>Player</th><th>Pos</th><th>VOR</th><th>ADP</th><th>P survives</th><th></th></tr>`;
    const board = alive.filter(p => p.pos !== "K" && p.pos !== "DEF").sort((a, b) => b.vor - a.vor).slice(0, 14);
    for (const p of board){
      const s = condSurvival(p.adp, myNextTwo[0], cur);
      h += `<tr><td>${esc(p.name)}${injBadge(p)}</td><td>${p.pos}</td>
        <td class="num">${p.vor.toFixed(0)}</td><td class="num">${p.adp.toFixed(1)}</td>
        <td class="num">${pct(s)}</td>
        <td>${s < 0.4 ? '<span class="verdict take" style="font-size:11px">going, going</span>' : ""}</td></tr>`;
    }
    h += `</table><p class="small">Conditional on being undrafted now - recomputed against the
      ${LiveState.picks.length} players actually gone, not the pre-draft model.</p></div>`;
  }
  $("app").innerHTML = h;
  $("seatbar").hidden = true;
}

function tickClock(){
  if (!LiveState.clockStart) return;
  const left = Math.max(0, 120 - Math.floor((Date.now() - LiveState.clockStart) / 1000));
  const el = $("clock");
  if (el){
    el.textContent = Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0");
    el.classList.toggle("low", left <= 30);
  }
}

// ---- mode detection and polling
const API = "https://api.sleeper.app/v1/draft/" + (E.league ? E.league.draft_id : "");
// slot_to_roster_id returns the identity map {1:1,...,12:12} before the draw and a
// real permutation after. A genuine draw landing on identity is 1 in 12!, so treat
// identity as "not drawn yet".
function realSlotMap(draft){
  const m = draft.slot_to_roster_id;
  if (!m || !Object.keys(m).length) return null;
  const identity = Object.keys(m).every(k => Number(m[k]) === Number(k));
  return identity ? null : m;
}
function isRealOrder(draft){
  if (draft.draft_order && Object.keys(draft.draft_order).length) return true;
  return realSlotMap(draft) !== null;
}
// Two independent paths to the seat. draft_order is keyed by user id and is the
// primary signal; slot_to_roster_id is the fallback, since roster_id 7 is stable
// even if the order is published without a per-user mapping.
function detectSeat(draft){
  const byUser = (draft.draft_order || {})[E.league.anthony_user_id];
  if (byUser) return Number(byUser);
  const m = realSlotMap(draft);
  if (!m) return null;
  for (const slot of Object.keys(m))
    if (Number(m[slot]) === E.league.anthony_roster_id) return Number(slot);
  return null;
}
async function refresh(){
  let draft;
  try {
    draft = await (await fetch(API)).json();
    $("banner").hidden = true;
  } catch (e){
    $("banner").hidden = false;
    $("banner").className = "banner err";
    $("banner").textContent = "Sleeper unreachable - showing embedded pre-draft model, generated " +
      E.generated + ". Numbers may be stale.";
    $("mode").textContent = "OFFLINE - PRE-DRAFT MODEL";
    if (!document.querySelector(".rowcard")) renderPre(E.league.anthony_roster_id || 7);
    schedule(60);
    return;
  }
  const live = draft.status === "drafting" || draft.status === "complete" ||
               (isRealOrder(draft) && draft.status !== "pre_draft");
  const seat = detectSeat(draft);
  if (seat) LiveState.mySlot = seat;
  if (!live){
    $("mode").textContent = "MODE 1 - PRE-DRAFT - all 12 scenarios";
    $("mode").classList.remove("live");
    if (LiveState.mySlot){
      $("banner").hidden = false;
      $("banner").className = "banner";
      $("banner").textContent = "Draft order is drawn - you are seat " + LiveState.mySlot +
        ". Showing that scenario; the room goes live when the draft starts.";
      if (!document.querySelector(".rowcard")) renderPre(LiveState.mySlot);
    } else if (!document.querySelector(".rowcard")){
      renderPre(7); // documented seat last year; all 12 chips available
    }
    schedule(60);
    return;
  }
  // LIVE
  $("mode").textContent = "MODE 2 - LIVE" + (LiveState.mySlot ? " - you are seat " + LiveState.mySlot : "");
  $("mode").classList.add("live");
  try {
    const picks = await (await fetch(API + "/picks")).json();
    if (picks.length !== LiveState.lastPickCount){
      LiveState.lastPickCount = picks.length;
      LiveState.clockStart = Date.now();
    }
    LiveState.picks = picks;
    renderLive(draft);
  } catch (e){ /* keep last render */ }
  schedule(draft.status === "drafting" ? 10 : 60);
}
function schedule(sec){
  clearTimeout(LiveState.timer);
  LiveState.timer = setTimeout(refresh, sec * 1000);
}

$("foot").innerHTML = "13 seasons - 2,339 picks - Sleeper live feed - generated " +
  esc(E.generated || "?") + "<br>Regenerate with python3 src/engine_2026.py the morning of " +
  (E.league ? esc(E.league.draft_date) : "the draft") + ". " + esc(E.adp_sd_note || "") +
  ". No champion mimicry - every call here is VOR and tier math; eight draft-day " +
  "hypotheses are null and stay that way.";
setInterval(tickClock, 1000);
if (E.league) refresh(); else $("app").innerHTML =
  '<div class="banner err">No engine data embedded - run python3 src/engine_2026.py</div>';
</script>
