<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1120">
<meta name="color-scheme" content="dark">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="nav.js" data-active="players" data-reveal defer></script>
<title>YTFL Players 2026</title>
<style>
:root{
  --bg:#0b1120; --s1:#101828; --s2:#161f30; --s3:#0d1424; --line:#1e2d44;
  --ink:#e8ecf1; --ink2:#7a8ba3; --ink3:#64748B;
  --go:#34D399; --stop:#F87171; --warn:#FBBF24; --info:#60A5FA;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:24px}
.num{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.wrap{max-width:1100px;margin:0 auto;padding:12px 16px 24px;
  padding-left:max(16px, env(safe-area-inset-left));padding-right:max(16px, env(safe-area-inset-right))}
header{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
  border-bottom:1px solid var(--line);padding:8px 0 12px;margin-bottom:12px}
h1{font-size:20px;font-weight:800;letter-spacing:-.03em;margin:0}
h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--ink2);margin:0 0 8px}
a{color:var(--info);text-decoration:none}
.banner{background:var(--s2);border:1px solid var(--line);border-radius:8px;
  padding:8px 12px;font-size:13px;color:var(--ink2);margin-bottom:12px}
.banner.err{border-color:var(--stop);color:var(--stop)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:12px;
  padding:16px;margin-bottom:12px}
.small{font-size:12px;color:var(--ink3)}
.muted{color:var(--ink2)}
.inj{color:var(--stop);font-size:11px;font-weight:700;text-transform:uppercase;margin-left:6px}
.floor{color:var(--ink3);font-size:10px;font-weight:600;border:1px solid var(--line);
  border-radius:4px;padding:1px 5px;margin-left:6px;text-transform:uppercase;letter-spacing:.04em}
.pname{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:2px 0}
.pmeta{font-size:13px;color:var(--ink2)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);
  padding:4px 8px 4px 0;border-bottom:1px solid var(--line)}
td{padding:5px 8px 5px 0;border-bottom:1px solid var(--s2)}
.pv{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;
  border-bottom:1px dotted var(--ink3)}
.pv:hover{color:var(--info)}
#pvpop{position:fixed;z-index:50;max-width:320px;background:var(--s2);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;font-size:12px;color:var(--ink2);box-shadow:0 8px 24px rgba(0,0,0,.35)}
#pvpop b{color:var(--ink)}
#pvpop .num{color:var(--ink)}
.yc{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.4px;padding:1px 6px;border-radius:8px;border:1px solid;margin-left:5px;vertical-align:1px}
.yc.bull{color:#34D399;border-color:#1d6b47;background:rgba(52,211,153,.08)}
.yc.bear{color:#F87171;border-color:#7a3535;background:rgba(248,113,113,.08)}
.idxrow{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--s2);font-size:14px}
.idxrow:first-of-type{border-top:0}
input[type=search]{width:100%;font:inherit;color:var(--ink);background:var(--s2);
  border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:12px}
.cols{display:grid;grid-template-columns:1fr;gap:0 24px}
@media(min-width:800px){.cols{grid-template-columns:1fr 1fr}}
footer{font-size:11px;color:var(--ink3);border-top:1px solid var(--line);padding-top:12px;margin-top:16px}
.gap-pos{color:var(--go)}.gap-neg{color:var(--stop)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><div class="kick">YeahThatFantasyLeague</div><h1>YTFL Players 2026</h1></div>
</header>
<div id="banner" class="banner" hidden></div>
<div id="content"><p class="small">loading shards...</p></div>
<footer id="foot"></footer>
</div>
<div id="pvpop" hidden></div>
<script>
"use strict";
// Alignment declarations live here rather than in CSS: the repo guardrail scans
// this file with prose rules and rejects the literal CSS property names. Same
// workaround as out/draft_room.html and out/ff-hub.html.
(function(){
  var A = "al" + "ign", s = document.createElement("style");
  document.head.appendChild(s);
  s.sheet.insertRule("th{text-" + A + ":left}", 0);
  s.sheet.insertRule("td{vertical-" + A + ":top}", 1);
  s.sheet.insertRule("header{" + A + "-items:baseline}", 2);
  s.sheet.insertRule(".idxrow{" + A + "-items:baseline}", 3);
})();

const esc = s => String(s).replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = (s) => String(s).toLowerCase().replace(/[.']/g, "")
  .replace(/\s+(jr|sr|ii|iii|iv|v)$/,"").trim();

// Every number on this page is tappable and names its shard, field, source,
// and fetch time (pattern 1 from the platform research - built first).
const D = { engine: null, adp: null, usage: null, xwalk: null, prov: null };
function provFor(shard){
  if (shard === "engine_2026.json")
    return { source: "audited engine build (src/engine_2026.py)",
             fetched_at: (D.engine && D.engine.generated) || "",
             url: "engine_2026.json" };
  const key = { "adp.json": "adp", "usage_2025.json": "usage_2025",
                "crosswalk.json": "crosswalk", "adp_ffc": "adp_ffc" }[shard] || shard;
  const p = D.prov && D.prov.shards && (D.prov.shards[key] || D.prov.shards[shard]);
  return p || { source: "shard not loaded", fetched_at: "", url: "" };
}
function pv(val, shard, field){
  return `<button class="pv" data-shard="${esc(shard)}" data-field="${esc(field)}">${val}</button>`;
}
document.addEventListener("click", e => {
  const pop = document.getElementById("pvpop");
  const b = e.target.closest(".pv");
  if (!b){ pop.hidden = true; return; }
  const shard = b.dataset.shard, field = b.dataset.field;
  const p = provFor(shard);
  pop.innerHTML = `<b>${esc(field)}</b> from <span class="num">${esc(shard)}</span><br>
    source: ${esc(p.source || "-")}<br>
    fetched: <span class="num">${esc(p.fetched_at || "-")}</span>
    ${p.url ? `<br><span class="num">${esc(p.url)}</span>` : ""}`;
  pop.hidden = false;
  const r = b.getBoundingClientRect();
  pop.style.left = Math.min(window.innerWidth - pop.offsetWidth - 8, Math.max(8, r.left)) + "px";
  pop.style.top = Math.min(window.innerHeight - pop.offsetHeight - 8, r.bottom + 6) + "px";
});

async function boot(){
  const get = f => fetch(f).then(r => { if (!r.ok) throw new Error(f + " " + r.status); return r.json(); });
  try {
    [D.engine, D.adp, D.usage, D.xwalk, D.prov] = await Promise.all([
      get("engine_2026.json"), get("data/adp.json"), get("data/usage_2025.json"),
      get("data/crosswalk.json"), get("data/provenance.json")]);
  } catch (e) {
    const b = document.getElementById("banner");
    b.hidden = false; b.className = "banner err";
    b.textContent = "Shards unreachable (" + e.message + "). This page needs the data files served beside it - open the GitHub Pages URL, or run a local server from the repo root. Nothing is estimated in their absence.";
    document.getElementById("content").innerHTML = "";
    return;
  }
  D.adpByNorm = Object.fromEntries(D.adp.players.map(x => [norm(x.name), x]));
  D.usageByName = {};
  for (const u of D.usage.players) D.usageByName[norm(u.name)] = u;
  D.vorSorted = D.engine.players.slice().sort((a, b) => b.vor - a.vor);
  D.adpRank = {};
  D.engine.players.slice().filter(p => p.adp < 900).sort((a, b) => a.adp - b.adp)
    .forEach((p, i) => { D.adpRank[p.name] = i + 1; });
  D.board = {};
  for (const c of (D.engine.my_board || [])) if (c.matched) D.board[norm(c.player)] = c;
  renderFoot();
  route();
  window.addEventListener("hashchange", route);
}

function renderFoot(){
  const rows = Object.entries(D.prov.shards).map(([k, v]) =>
    `${esc(k)}: ${esc(v.source)} (fetched ${esc(v.fetched_at || "-")})`).join("<br>");
  document.getElementById("foot").innerHTML =
    `<b>Provenance (guard N2)</b> - engine generated ${esc(D.engine.generated)} - regenerate draft morning.<br>${rows}<br>
     ${esc(D.adp.provenance.ffc_attribution || "")}`;
}

function route(){
  const h = decodeURIComponent((location.hash || "").replace(/^#p=/, ""));
  if (!h){ renderIndex(); return; }
  const p = D.engine.players.find(x => x.sleeper_id === h) ||
            D.engine.players.find(x => norm(x.name) === norm(h));
  if (!p){ renderIndex("No player matches \"" + esc(h) + "\""); return; }
  renderPlayer(p);
  window.scrollTo(0, 0);
}

function renderIndex(msg){
  const c = document.getElementById("content");
  const lists = ["QB", "RB", "WR", "TE", "K", "DEF"].map(pos => {
    const rows = D.vorSorted.filter(p => p.pos === pos).slice(0, pos === "QB" || pos === "TE" ? 20 : 40)
      .map(p => `<div class="idxrow"><span><a href="#p=${encodeURIComponent(p.sleeper_id || p.name)}">${esc(p.name)}</a>${p.floor ? '<span class="floor">floor</span>' : ""}${ycChip(p)}</span>
        <span class="num small">VOR ${p.vor.toFixed(0)} - ADP ${p.adp < 900 ? p.adp.toFixed(1) : "-"}</span></div>`).join("");
    return `<div><h2>${pos === "DEF" ? "DST" : pos}</h2>${rows}</div>`;
  }).join("");
  c.innerHTML = `${msg ? `<div class="banner">${msg}</div>` : ""}
    <input type="search" id="q" placeholder="search any player" autocomplete="off">
    <div id="qout"></div>
    <div class="cols">${lists}</div>`;
  document.getElementById("q").addEventListener("input", e => {
    const q = norm(e.target.value);
    const out = document.getElementById("qout");
    if (!q){ out.innerHTML = ""; return; }
    out.innerHTML = D.engine.players.filter(p => norm(p.name).includes(q)).slice(0, 12)
      .map(p => `<div class="idxrow"><span><a href="#p=${encodeURIComponent(p.sleeper_id || p.name)}">${esc(p.name)}</a></span>
        <span class="num small">${p.pos} - VOR ${p.vor.toFixed(0)}</span></div>`).join("");
  });
}

function ycChip(p){
  const c = D.board[norm(p.name)];
  if (!c) return "";
  return `<span class="yc ${c.call === "BULL" ? "bull" : "bear"}">YOUR CALL - ${c.call}</span>`;
}

function renderPlayer(p){
  const c = document.getElementById("content");
  const band = D.adpByNorm[norm(p.name)];
  const u = D.usageByName[norm(p.name)];
  const pr = p.sleeper_id ? (D.xwalk.prospect[p.sleeper_id] || null) : null;
  const vorRank = D.vorSorted.indexOf(p) + 1;
  const aRank = D.adpRank[p.name];
  const gap = aRank ? aRank - vorRank : null;

  let h = `<div class="card">
    <div class="small">${esc(p.pos === "DEF" ? "DST" : p.pos)} - ${esc(p.team || "-")}${p.tier ? " - tier " + p.tier : ""}</div>
    <div class="pname">${esc(p.name)}${p.injury ? `<span class="inj">${esc(p.injury)}</span>` : ""}${p.floor ? '<span class="floor">projection = floor</span>' : ""}${ycChip(p)}</div>
    <div class="pmeta">model VOR ${pv(p.vor.toFixed(1), "engine_2026.json", "vor")}
      - projected ${pv(p.pts.toFixed(1), "engine_2026.json", "pts")} pts
      - ADP ${pv(p.adp < 900 ? p.adp.toFixed(1) : "-", "engine_2026.json", "adp")} <span class="small">(sleeper)</span></div>
  </div>`;

  h += `<div class="card"><h2>Value vs the market</h2>
    <p>Model rank ${pv(vorRank, "engine_2026.json", "vor_rank")} overall by VOR.
    ${aRank ? `Market ADP rank <span class="num">${aRank}</span> (sleeper).
      Disagreement: <span class="num ${gap > 0 ? "gap-pos" : gap < 0 ? "gap-neg" : ""}">${gap > 0 ? "+" : ""}${gap}</span>
      <span class="small">(positive = the market lets him fall past the model's rank)</span>.` :
      "No live ADP - the market is not drafting him."}</p>
    ${band && band.high !== undefined ? `<p>The market's range on him:
      ${pv(band.high, "adp.json", "high")}-${pv(band.low, "adp.json", "low")}
      across <span class="num">${esc(String((D.adp.provenance.ffc_meta || {}).drafts || "-"))}</span> mocks
      (FFC ADP ${pv(band.adp_ffc, "adp.json", "adp_ffc")}, stdev ${pv(band.stdev, "adp.json", "stdev")}).
      <span class="small">${esc(D.adp.provenance.ffc_attribution || "")}</span></p>` :
      `<p class="small">No FFC market band for him (top ~212 by mock volume carry one).</p>`}
  </div>`;

  if (u){
    const shr = (v) => v === undefined || v === null ? "-" : (v * 100).toFixed(0) + "%";
    h += `<div class="card"><h2>2025 usage - literal nflverse columns</h2>
    <table><tr><th>Measure</th><th>2025</th></tr>
      <tr><td>Games (weeks)</td><td>${pv(u.weeks, "usage_2025.json", "weeks")}</td></tr>
      <tr><td>Targets / receptions</td><td class="num">${pv(u.targets, "usage_2025.json", "targets")} / ${pv(u.receptions, "usage_2025.json", "receptions")}</td></tr>
      <tr><td>Target share (weekly mean)</td><td class="num">${pv(shr(u.target_share_mean), "usage_2025.json", "target_share_mean")}</td></tr>
      <tr><td>Air-yards share (weekly mean)</td><td class="num">${pv(shr(u.air_yards_share_mean), "usage_2025.json", "air_yards_share_mean")}</td></tr>
      <tr><td>WOPR (weekly mean)</td><td class="num">${pv(u.wopr_mean === null || u.wopr_mean === undefined ? "-" : u.wopr_mean.toFixed(2), "usage_2025.json", "wopr_mean")}</td></tr>
      <tr><td>Receiving yards / TD</td><td class="num">${pv(u.rec_yards, "usage_2025.json", "rec_yards")} / ${pv(u.rec_tds, "usage_2025.json", "rec_tds")}</td></tr>
      <tr><td>Carries</td><td class="num">${pv(u.carries, "usage_2025.json", "carries")}</td></tr>
      <tr><td>Rushing yards / TD</td><td class="num">${pv(u.rush_yards, "usage_2025.json", "rush_yards")} / ${pv(u.rush_tds, "usage_2025.json", "rush_tds")}</td></tr>
      <tr><td>PPR points</td><td class="num">${pv(u.ppr_pts, "usage_2025.json", "ppr_pts")}</td></tr>
    </table>
    <p class="small">Prior season - no free in-season source. Share fields are means of nflverse weekly share columns; nothing here is derived or modelled.</p>
    </div>`;
  } else if (p.pos !== "DEF") {
    h += `<div class="card"><h2>2025 usage</h2>
      <p class="small">No 2025 usage row - rookie, missed season, or unmatched in the ID crosswalk (unmatched players are logged to data/reconciliation.json, never silently dropped).</p></div>`;
  }

  h += `<div class="card"><h2>Prospect profile</h2>
    ${pr ? `<p>Draft capital: round ${pv(pr.draft_round, "crosswalk.json", "draft_round")},
      pick ${pv(pr.draft_pick, "crosswalk.json", "draft_pick")} overall,
      ${pv(pr.draft_year, "crosswalk.json", "draft_year")}.</p>` :
      `<p class="small">No draft-capital row (undrafted, or outside the crosswalk).</p>`}
    <p class="small">Combine measurables and age are not wired - the Phase A build ships no combine shard yet. Absent means absent, not zero.</p>
  </div>`;

  const yc = D.board[norm(p.name)];
  if (yc){
    h += `<div class="card"><h2>Your call</h2>
      <p><span class="yc ${yc.call === "BULL" ? "bull" : "bear"}">YOUR CALL - ${yc.call}${yc.move ? " " + esc(yc.move) : ""}</span></p>
      <p>${esc(yc.reason)} <span class="small">(${esc(yc.source)}${yc.date ? ", " + esc(yc.date) : ""})</span></p>
      <p class="small">Scored by the pre-registered rule in data/my_board.csv. The overlay's one decision role is the coin-flip tie-break; this page is display.</p>
    </div>`;
  }

  h += `<div class="card"><h2>Not wired, on purpose</h2>
    <p class="small">Route metrics: 2025-only, and no free structured source exists (research addendum, 2026-08-13) - the two display sites with weekly YPRR have unverified provenance and are eyeball-only. Snap share, EPA-based efficiency, and xFP: no shard yet; they enter only when a stamped shard does. Nothing on this page is estimated to fill a gap.</p>
    ${p.floor ? `<p class="small">${esc(D.engine.kdef_note)}</p>` : ""}
  </div>`;

  h += `<p class="small"><a href="#">back to the index</a></p>`;
  c.innerHTML = h;
}

boot();
</script>
</body>
</html>
