# Scheduled draft-morning refresh (docs/DRAFT_MORNING.md).
# 10:00 UTC = 6:00 AM Eastern (EDT) on the two dates Anthony asked for:
# 08-28 (dry run, 11 days out) and 09-08 (draft morning itself).
# Every step is a gate. The commit only happens if all of them pass, so a
# red run leaves the last verified build serving. After a successful push,
# pages.yml is dispatched explicitly and deploys the site.
name: draft-refresh
on:
  schedule:
    - cron: "0 10 28 8 *"
    - cron: "0 10 8 9 *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rebuild and run every gate, but do not commit or push"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: draft-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # a hung step on draft morning is worse than a failed one - fail fast
    # and let the last verified build keep serving.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # the 2026 app. A stray firing in a later season would rebuild last
      # year's draft against this year's ADP - stop before that happens.
      - name: Season guard
        run: |
          year=$(date -u +%Y)
          if [ "$year" != "2026" ]; then
            echo "::error::draft-refresh is scoped to the 2026 season, but it is $year. Update the workflow before re-enabling."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # GEOMETRY PREFLIGHT. The P0 defect was a server-knowable value assumed
      # instead of read (a 120s clock against a 60s pick_timer). Nothing else
      # in the codebase reads draft.type or settings.reversal_round, and
      # TEAMS/ROUNDS are module constants never checked against the server -
      # all correct today only because the settings happen to match. Enable
      # third-round reversal and every computed pick number is wrong by a
      # snake turn while the board still renders. Fail here, before the
      # rebuild, rather than shipping a board built on a stale assumption.
      - name: Draft geometry preflight
        run: python3 src/preflight_draft.py

      # steps 2-4 of the runbook: live ADP and projections, then the CVS
      # board. Pure stdlib - no pip install needed.
      - name: Rebuild engine payload
        run: python3 src/engine_2026.py
      - name: Rebuild CVS inputs
        run: python3 src/build_cvs_inputs.py
      - name: Rebuild CVS board
        run: python3 src/build_cvs.py
      # The tree derives from the engine payload rebuilt above, so it has to
      # move with it - a previous refresh shifted 259 ADP values, and PATHS is
      # a nav-linked decision surface. Pure stdlib, no network, ~1s, and
      # byte-deterministic. The provenance guard in the page suite fails the
      # run if this is ever skipped and the tree falls behind the engine.
      - name: Rebuild VONA path tree
        run: python3 src/build_vona_tree.py
      # Both outputs read the engine payload directly. Mock carries the exact
      # engine content digest; the teaser embeds it beside the allowed names.
      - name: Rebuild mock-draft validation
        run: python3 src/mock_draft.py
      - name: Rebuild teaser
        run: python3 src/build_teaser.py

      # Ceiling and BULLISH are display-only and HISTORY-bound. Pulling their
      # 156 MB cache, pyarrow, and the live games source into this 25-minute
      # decision-critical job would add a new draft-morning failure path. They
      # instead carry the engine content digest: the three consuming pages hide
      # or neutralize stale values after this 06:00 build, and pages-data
      # rebuilds the complete chain at 08:00.

      # steps 5-9: the python gates, every one through run_gate.sh, which
      # demands exit 0 AND the ALL PASS sentinel together (the exit-code-
      # masking guard; its own self-test runs first). mathdiff is the
      # frozen-math law - it must print an EMPTY proof or the run stops here.
      - name: Gate runner self-test
        run: python3 tests/test_run_gate.py
      - name: Frozen survival behavior
        run: sh tests/run_gate.sh python3 tests/test_survival.py
      - name: Frozen math proof
        env:
          GATE_SENTINEL: "MATH DIFF PROOF: EMPTY"
        run: sh tests/run_gate.sh python3 tests/mathdiff.py
      - name: CVS guards
        run: sh tests/run_gate.sh python3 tests/test_cvs.py
      - name: VOR guards
        run: sh tests/run_gate.sh python3 tests/test_vor.py
      - name: Base-rate guards
        run: sh tests/run_gate.sh python3 tests/test_baserates.py
      - name: Archetype guards
        run: sh tests/run_gate.sh python3 tests/test_archetypes.py
      - name: Ceiling guards
        run: sh tests/run_gate.sh python3 tests/test_ceiling.py
      - name: BULLISH guards
        run: sh tests/run_gate.sh python3 tests/test_bullish.py
      - name: WS2 audit guards
        run: sh tests/run_gate.sh python3 tests/test_ws2.py
      - name: Mock-draft guards
        run: sh tests/run_gate.sh python3 tests/test_mock.py
      - name: BULLISH-vs-ADP INCONCLUSIVE finding guards
        run: sh tests/run_gate.sh python3 tests/test_bullish_vs_adp.py
      - name: VONA path-tree guards
        run: sh tests/run_gate.sh python3 tests/test_vona.py
      - name: Drafted-vs-acquired guards
        run: sh tests/run_gate.sh python3 tests/test_draft_vs_acquired.py
      - name: Page and data guards
        run: sh tests/run_gate.sh python3 tests/test_pages_data.py
      # The five determinism reruns in this suite are cache-gated and the
      # runner has no HISTORY cache, so they skip. run_gate now FAILS on a
      # skip by default (a skipped guard is not a passing guard); this is the
      # one place the skip is expected, so it is allowed explicitly and the
      # coverage loss is named here rather than being invisible: 5 of 38
      # checks in this suite do not run on CI, and they are precisely the
      # ones that prove the analysis artifacts reproduce from their inputs.
      # Closing this properly means committing or fetching the cache on the
      # runner - see docs/SELF_AUDIT_2026-08-26.md P2-U2.
      - name: Analysis guards
        env:
          GATE_ALLOW_SKIP: "1"
        run: sh tests/run_gate.sh python3 tests/test_analysis.py

      # step 10: the browser suite. The repo has no package.json, so the
      # driver and browser are installed here and the smoke is pointed at
      # them through PW_CHROMIUM.
      # Call the installed CLI directly. npx would prompt on stdin for a
      # package it cannot find and hang the whole job.
      - name: Install browser driver
        timeout-minutes: 10
        env:
          CI: "1"
          npm_config_yes: "true"
        run: |
          mkdir -p /tmp/pw
          cd /tmp/pw
          npm install --no-save --no-fund --no-audit playwright
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Full smoke
        timeout-minutes: 10
        run: |
          export NODE_PATH=/tmp/pw/node_modules
          PW_CHROMIUM=$(node -e "console.log(require('/tmp/pw/node_modules/playwright').chromium.executablePath())")
          echo "browser: $PW_CHROMIUM"
          test -x "$PW_CHROMIUM" || { echo "::error::chromium not found at $PW_CHROMIUM"; exit 1; }
          PW_CHROMIUM="$PW_CHROMIUM" sh tests/run_gate.sh node tests/smoke_draft_room.js out/draft_room.html

      - name: What moved
        run: |
          echo "## Refresh diff" >> "$GITHUB_STEP_SUMMARY"
          git diff --stat -- out/ >> "$GITHUB_STEP_SUMMARY" || true

      # step 11: ship. Every gate above is green by now, so this commit is
      # the build. The explicit dispatch below deploys it; a GITHUB_TOKEN push
      # does not trigger another workflow's push event.
      - name: Commit and push
        id: commit
        if: github.event_name == 'schedule' || inputs.dry_run == false
        run: |
          git config user.name "draft-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add out/
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "no payload changes - nothing to ship"
            exit 0
          fi
          git commit -m "draft refresh: live inputs $(date -u +%F)"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch Pages deployment
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main

      - name: Dry run notice
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: echo "::notice::Dry run - every gate passed, nothing committed."
