# Deploys the draft room to GitHub Pages on every push to main, via the
# legacy gh-pages branch: pushing that branch auto-creates the Pages site,
# which needs no admin API call - the artifact-based configure-pages
# enablement failed with "Resource not accessible by integration" because
# the Actions token cannot CREATE a Pages site, only push branches.
# Draft-morning production flow is .github/workflows/draft-refresh.yml. Never
# rebuild and ship the engine alone; its strict derivatives must move with it.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Publication is the shared boundary for manual merges and both producer
      # workflows. Re-run the declared downstream invariant guards before deploy.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CVS deterministic rebuild guards
        run: sh tests/run_gate.sh python3 tests/test_cvs.py
      - name: Archetype invariant guards
        run: sh tests/run_gate.sh python3 tests/test_archetypes.py
      - name: Ceiling invariant guards
        run: sh tests/run_gate.sh python3 tests/test_ceiling.py
      - name: BULLISH invariant guards
        run: sh tests/run_gate.sh python3 tests/test_bullish.py
      - name: VONA deterministic rebuild guards
        run: sh tests/run_gate.sh python3 tests/test_vona.py
      - name: Mock-draft deterministic rebuild guards
        run: sh tests/run_gate.sh python3 tests/test_mock.py
      - name: Cross-artifact linkage guards
        run: sh tests/run_gate.sh python3 tests/test_pages_data.py
      - name: Assemble site (apps + shards, not the 66MB archives)
        run: |
          mkdir -p _site/out/data
          cp index.html _site/
          cp out/draft_room.html out/big_board.html out/players.html out/paths.html \
             out/teams.html out/home.html out/nav.js out/icon-180.png out/ff-hub.html \
             out/engine_2026.json out/cvs.json _site/out/
          cp out/data/*.json out/data/heartbeat.txt _site/out/data/
          mkdir -p _site/out/teaser
          cp out/teaser/*.html _site/out/teaser/
          touch _site/.nojekyll
      - name: Push to gh-pages
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
